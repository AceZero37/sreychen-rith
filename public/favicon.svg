<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#181234" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Interlocking wedding rings -->
  <circle cx="26" cy="34" r="13" fill="none" stroke="url(#gold)" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="38" cy="34" r="13" fill="none" stroke="url(#gold)" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- Sparkle Diamond -->
  <path d="M 32 12 Q 32 20 37 20 Q 32 20 32 28 Q 32 20 27 20 Q 32 20 32 12 Z" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Little heart in center -->
  <path d="M 32 35 C 32 33, 29 31, 27 33 C 25 35, 27 38, 32 42 C 37 38, 39 35, 37 33 C 35 31, 32 33, 32 35 Z" fill="#ff6b8a"/>
</svg>

